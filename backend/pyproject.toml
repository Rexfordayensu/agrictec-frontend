[project]
name = "agrictec-api"
version = "1.0.0"
description = "The AgriCtec backend: FastAPI, PostgreSQL and the platform's business rules."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
