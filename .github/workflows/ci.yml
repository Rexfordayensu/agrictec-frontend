# Every push to main and every pull request: the app's own checks, then a rehearsal of the real
# deployment (deploy/ with Docker Compose: PostgreSQL, the API, this app and Caddy over HTTPS).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.cjs
      # PageProps/LayoutProps are generated by Next.js, not committed: create them first.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm audit --omit=dev
      - run: npm run build

  deploy-rehearsal:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.BACKEND_DEPLOY_KEY != '' }}
    steps:
      - name: Needs the backend deploy key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Skipped. Add BACKEND_DEPLOY_KEY (a read-only deploy key on agrictec-backend) to run it."
      # The compose file builds the API from ../../agrictec-backend, so both repositories are
      # checked out side by side. The backend is private: BACKEND_DEPLOY_KEY is a read-only
      # deploy key on that repository.
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
        with:
          path: app
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
        with:
          repository: Rexfordayensu/agrictec-backend
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          path: agrictec-backend
      - name: Write deploy/.env (throwaway secrets for this run)
        if: env.HAS_KEY == 'true'
        working-directory: app/deploy
        run: |
          cat > .env <<EOF
          DOMAIN=localhost
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          SECRET_KEY=$(openssl rand -hex 32)
          ADMIN_EMAIL=owner@example.com
          ADMIN_PASSWORD=Rehearsal-Pass-1
          EOF
      - name: Build and start the stack
        if: env.HAS_KEY == 'true'
        working-directory: app/deploy
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check it from outside, through Caddy
        if: env.HAS_KEY == 'true'
        run: |
          set -eu
          # Caddy signs localhost with its own CA, so certificates aren't checked here (-k).
          code() { curl -sk -o /dev/null -w '%{http_code}' "$@"; }
          echo "HTTP redirects to HTTPS"
          test "$(code http://localhost/login)" = 308
          echo "The app serves its sign-in page"
          test "$(code https://localhost/login)" = 200
          echo "The API answers through the app"
          curl -skf https://localhost/api/v1/health
          echo
          echo "The owner's Super Admin signs in; the session cookie is Secure and httpOnly"
          headers=$(curl -sk -D - -o /dev/null -X POST https://localhost/api/v1/admin/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"owner@example.com","password":"Rehearsal-Pass-1"}')
          echo "$headers" | head -1 | grep -q ' 200'
          echo "$headers" | grep -i '^set-cookie: agrictec_admin=' | grep -qi 'secure'
          echo "$headers" | grep -i '^set-cookie: agrictec_admin=' | grep -qi 'httponly'
          echo "The demo Super Admin doesn't exist in production"
          test "$(code -X POST https://localhost/api/v1/admin/auth/login -H 'content-type: application/json' \
            -d '{"email":"superadmin@agrictec.app","password":"Admin@2026"}')" = 401
          echo "Security headers are set"
          curl -skI https://localhost/login | grep -qi '^strict-transport-security:'
          echo "All checks passed"
      - name: Logs
        if: failure() && env.HAS_KEY == 'true'
        working-directory: app/deploy
        run: docker compose logs --no-color --tail 200
      - name: Stop
        if: always() && env.HAS_KEY == 'true'
        working-directory: app/deploy
        run: docker compose down -v
